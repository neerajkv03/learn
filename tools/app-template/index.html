<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learn</title>
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400..800;1,400..800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress__bar"></div>
    </div>
    <header class="header">
      <button class="icon-btn menu-btn" type="button" aria-label="Open topics" aria-expanded="false">
        <svg class="i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        <svg class="i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <a class="logo" href="#home"><span class="logo__mark"></span><span class="logo__word">Learn</span></a>
      <div class="crumb" id="crumb"></div>
      <button class="icon-btn theme-btn" type="button" aria-label="Switch theme"></button>
    </header>
    <div class="layout">
      <nav class="sidebar sidebar--left" aria-label="Topics">
        <div class="sidebar__label">Topics</div>
        <ul class="topics"></ul>
      </nav>
      <main class="content" id="main" tabindex="-1"></main>
      <aside class="sidebar sidebar--right" aria-label="On this page">
        <div class="sidebar__label">On this page</div>
        <ul class="subtopics"></ul>
        <div class="toc-progress">
          <strong class="toc-progress__pct">0%</strong> read
          <div class="toc-progress__track"><div class="toc-progress__fill"></div></div>
        </div>
      </aside>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.js"></script>
    <script src="data/manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
